<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <!-- Banner -->
        <div class="banner">
            <img src="banner.png" alt="banner">
        </div>
        <!-- Login Content -->
        <div class="login-content">
            <div class="login-form">
                <div class="logo">
                    <img src="instagram.png" alt="Instagram">
                </div>
                <input type="text" placeholder="Phone number, username, or email" id="username">
                <input type="password" placeholder="Password" id="password">
                <button class="login-button">Log in</button>
                <div class="seperation">
                    <div class="decorative-line"></div>
                    <div class="or">OR</div>
                    <div class="decorative-line"></div>
                </div>
                <button class="fb-button" ><img src="facebook_icon.png" alt="icon">Log in with Facebook</button>
                <div class="forget-password">
                    <a href="">Forget password?</a>
                </div>
            </div>
            <div class="go-to-signup">
                <p>Don't have an account? <span><a href="">Sign up</a></span></p>
            </div>
            <div class="get-app">
                <p>Get the app.</p>
                <img src="google-play.png" alt="btn">
                <img src="microsoft.png" alt="btn">
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="references">
            <span><a href="" class="hover-property">Meta</a></span>
            <span><a href="" class="hover-property">About</a></span>
            <span><a href="" class="hover-property">Blog</a></span>
            <span><a href="">Jobs</a></span>
            <span><a href="" class="hover-property">Help</a></span>
            <span><a href="" class="hover-property">API</a></span>
            <span><a href="">Privacy</a></span>
            <span><a href="">Terms</a></span>
            <span><a href="">Locations</a></span>
            <span><a href="">Instagram Lite</a></span>
            <span><a href="" class="hover-property">Threads</a></span>
            <span><a href="">Contact Uploading &amp; Non-users</a></span>
            <span><a href="" class="hover-property">Meta Verified</a></span>
        </div>
        <div class="site-settings">
            <select name="language" id="language">
                <option value="english">English</option>
                <option value="hindi">Hindi</option>
            </select>
            <span>&copy; 2024 Instagram from Meta</span>
        </div>
    </footer>
</body>
</html>
