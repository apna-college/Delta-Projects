<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
    
    <div class="container"> 
        <div class="top">
            <h1>Quotes</h1>
            <p>Quotes that will inspire and enlighten you.</p>
        </div>
        <div class="main">
            <div class="quote-area">
                <p id="quote">
                    "In all the World, there is no heart for me like yours.In all the world, there is no love for you like mine."</p>
                <p id="author">
                    <br>
                    - MAYA ANGELOU ❤️ 
                </p>
            </div> 
        </div>
        <div class="bottom">
            <button id="btn">Generate new quote</button>
            <button id="copyBtn">📋 Copy Quote</button>
        </div> 
        <div class="end">
            <p>Made using Quote Garden API</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
