<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Razorpay Demo Store" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Razorpay Demo</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      Razorpay Checkout SDK must be loaded BEFORE React initialises.
      Placing it here (end of body) is correct — React scripts are injected
      after this tag by CRA, so Razorpay will be available on window.Razorpay
      when paymentHandler is called.
    -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </body>
</html>
